<!doctype html>
<meta charset="utf-8" />
<title>push vs iframe pollution</title>
<style>
  body {
    font: 14px/1.5 system-ui;
    padding: 24px;
  }
  button {
    font-size: 18px;
    padding: 12px 24px;
  }
  pre {
    background: #f2f2f2;
    padding: 12px;
  }
</style>
<h1>iframe pollution vs pushState</h1>
<p>Click RUN once (a real click - the whole point is user activation).</p>
<button id="run">RUN</button>
<pre id="out"></pre>
<iframe id="f" style="width: 200px; height: 40px"></iframe>
<script>
  const out = document.getElementById('out');
  const f = document.getElementById('f');

  const log = (line) => {
    out.textContent += line + '\n';
  };

  const snap = (label) =>
    log(
      `${label}: length=${history.length} navIdx=${
        window.navigation ? navigation.currentEntry.index : 'n/a'
      } url=${location.pathname + location.search + location.hash}`
    );

  const navFrame = (n) =>
    new Promise((resolve) => {
      f.onload = resolve;
      f.src = `frame.html?n=${n}`;
    });

  document.getElementById('run').onclick = async () => {
    out.textContent = '';

    snap('start');

    for (let i = 1; i <= 4; i++) {
      await navFrame(i);
      snap(`after frame nav ${i}`);
    }

    const polluted = history.length;

    history.replaceState({ r: 1 }, '', '#replaced');
    snap('after replaceState');
    log(
      `  replace verdict: ${
        history.length === polluted ? 'pollution survived' : 'pruned'
      }`
    );

    history.pushState({ p: 1 }, '', '#pushed');
    snap('after pushState');
    log(
      `  push verdict: ${
        history.length === polluted + 1
          ? 'POLLUTION SURVIVED'
          : 'PRUNED (push cleans it up)'
      }`
    );
  };

  window.dump = () => out.textContent;
</script>
