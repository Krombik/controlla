<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async control - controlla</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; padding: 1.5rem; font: 15px/1.55 system-ui, sans-serif; max-width: 44rem; }
      h1 { font-size: 1.3rem; margin: 0 0 .3rem; }
      p.lede { color: #6b7280; margin: 0 0 1.5rem; }
      fieldset { border: 1px solid #8883; border-radius: 8px; margin: 0 0 1rem; }
      legend { padding: 0 .4rem; font-weight: 600; }
      button, input, select { font: inherit; padding: .35rem .5rem; border: 1px solid #8886; border-radius: 6px; background: transparent; color: inherit; }
      button { cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
      .muted { color: #6b7280; }
      .count { float: right; font-size: .78rem; color: #6b7280; font-variant-numeric: tabular-nums; }
      code { font-family: ui-monospace, monospace; font-size: .9em; }
    </style>
